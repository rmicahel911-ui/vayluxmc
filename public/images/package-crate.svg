<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Cajas y llaves">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="60%">
      <stop offset="0" stop-color="#ffb81f" stop-opacity=".3"/>
      <stop offset=".5" stop-color="#e11d48" stop-opacity=".14"/>
      <stop offset="1" stop-color="#0f0508" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b91c1c"/>
      <stop offset=".55" stop-color="#3a0a17"/>
      <stop offset="1" stop-color="#3a0a17"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset=".45" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#0f0508"/>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g stroke="#f43f5e" stroke-opacity=".07" stroke-width="1">
