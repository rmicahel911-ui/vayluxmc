<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Monedas">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="60%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".3"/>
      <stop offset=".5" stop-color="#e11d48" stop-opacity=".12"/>
      <stop offset="1" stop-color="#0f0508" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset=".4" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#0f0508"/>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g stroke="#f43f5e" stroke-opacity=".07" stroke-width="1">
    <path d="M0 100H800M0 200H800M0 300H800M0 400H800M0 500H800"/>
    <path d="M100 0V600M200 0V600M300 0V600M400 0V600M500 0V600M600 0V600M700 0V600"/>
  </g>

  <ellipse cx="400" cy="500" rx="200" ry="26" fill="#000" opacity=".5"/>

  <!-- coin stack -->
  <g>
    <rect x="286" y="424" width="228" height="42" rx="21" fill="url(#edge)"/>
    <rect x="286" y="404" width="228" height="42" rx="21" fill="url(#coin)"/>
    <rect x="310" y="414" width="180" height="6" rx="3" fill="#fef3c7" opacity=".6"/>

    <rect x="302" y="374" width="196" height="40" rx="20" fill="url(#edge)"/>
    <rect x="302" y="356" width="196" height="40" rx="20" fill="url(#coin)"/>
    <rect x="324" y="366" width="152" height="6" rx="3" fill="#fef3c7" opacity=".6"/>

    <rect x="318" y="328" width="164" height="38" rx="19" fill="url(#edge)"/>
    <rect x="318" y="312" width="164" height="38" rx="19" fill="url(#coin)"/>
    <rect x="338" y="322" width="124" height="6" rx="3" fill="#fef3c7" opacity=".6"/>
  </g>

  <!-- big front coin -->
  <g>
    <circle cx="400" cy="420" r="98" fill="#7c2d12"/>
    <circle cx="400" cy="408" r="98" fill="url(#coin)"/>
    <circle cx="400" cy="408" r="76" fill="none" stroke="#b45309" stroke-width="6" opacity=".65"/>
    <path d="M400 358l16 32 36 4-26 26 6 36-32-18-32 18 6-36-26-26 36-4z" fill="#7c2d12"/>
    <path d="M400 368l12 24 27 3-20 19 5 27-24-14-24 14 5-27-20-19 27-3z" fill="#fef3c7" opacity=".55"/>
  </g>

  <!-- floating coins -->
  <g opacity=".95">
    <ellipse cx="604" cy="212" rx="46" ry="14" fill="#7c2d12"/>
    <ellipse cx="604" cy="200" rx="46" ry="14" fill="url(#coin)"/>
    <ellipse cx="604" cy="200" rx="34" ry="9" fill="none" stroke="#b45309" stroke-width="4" opacity=".6"/>

    <ellipse cx="202" cy="266" rx="34" ry="10" fill="#7c2d12"/>
    <ellipse cx="202" cy="257" rx="34" ry="10" fill="url(#coin)"/>
    <ellipse cx="202" cy="257" rx="24" ry="6" fill="none" stroke="#b45309" stroke-width="3" opacity=".6"/>
  </g>

  <g fill="#fef3c7" opacity=".8">
    <rect x="540" y="120" width="8" height="8"/>
    <rect x="196" y="170" width="6" height="6"/>
    <rect x="640" y="330" width="6" height="6"/>
    <rect x="150" y="380" width="5" height="5"/>
  </g>
</svg>
