<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" shape-rendering="crispEdges" role="img" aria-label="Cofre de recompensas">
  <defs>
    <radialGradient id="halo" cx="50%" cy="55%" r="50%">
      <stop offset="0" stop-color="#e11d48" stop-opacity=".55"/>
      <stop offset="0.55" stop-color="#881337" stop-opacity=".22"/>
      <stop offset="1" stop-color="#881337" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset=".45" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#be123c"/>
      <stop offset="1" stop-color="#3a0a17"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#881337"/>
      <stop offset=".55" stop-color="#2a0f18"/>
      <stop offset="1" stop-color="#2a0812"/>
    </linearGradient>
  </defs>

  <ellipse cx="180" cy="210" rx="168" ry="150" fill="url(#halo)"/>

  <!-- floating sparkles -->
  <g fill="#ffd27a">
    <rect x="44" y="86" width="10" height="10"/>
    <rect x="39" y="91" width="20" height="4" opacity=".55"/>
    <rect x="304" y="118" width="8" height="8" opacity=".9"/>
    <rect x="300" y="122" width="16" height="3" opacity=".45"/>
    <rect x="286" y="266" width="10" height="10" opacity=".7"/>
    <rect x="60" y="286" width="7" height="7" opacity=".6"/>
  </g>
  <g fill="#ffd27a" opacity=".8">
    <rect x="90" y="62" width="5" height="5"/>
    <rect x="262" y="70" width="6" height="6"/>
  </g>

  <!-- shadow -->
  <ellipse cx="180" cy="316" rx="112" ry="16" fill="#000" opacity=".55"/>

  <!-- lid -->
  <rect x="46" y="126" width="268" height="98" fill="#1f0710"/>
  <rect x="54" y="134" width="252" height="82" fill="url(#lid)"/>
  <rect x="54" y="134" width="252" height="10" fill="#f43f5e" opacity=".55"/>
  <rect x="54" y="168" width="252" height="4" fill="#3a0a17" opacity=".7"/>
  <rect x="54" y="202" width="252" height="4" fill="#3a0a17" opacity=".7"/>

  <!-- gold bands on lid -->
  <rect x="94" y="126" width="30" height="98" fill="#1f0710"/>
  <rect x="98" y="130" width="22" height="90" fill="url(#gold)"/>
  <rect x="98" y="130" width="6" height="90" fill="#ffd27a" opacity=".55"/>

  <rect x="236" y="126" width="30" height="98" fill="#1f0710"/>
  <rect x="240" y="130" width="22" height="90" fill="url(#gold)"/>
  <rect x="240" y="130" width="6" height="90" fill="#ffd27a" opacity=".55"/>

  <!-- body -->
  <rect x="46" y="216" width="268" height="98" fill="#1f0710"/>
  <rect x="54" y="224" width="252" height="82" fill="url(#body)"/>
  <rect x="54" y="224" width="252" height="8" fill="#f43f5e" opacity=".3"/>
  <rect x="62" y="248" width="236" height="4" fill="#2a0812" opacity=".8"/>
  <rect x="62" y="276" width="236" height="4" fill="#2a0812" opacity=".8"/>

  <!-- gold bands on body -->
  <rect x="94" y="216" width="30" height="98" fill="#1f0710"/>
  <rect x="98" y="220" width="22" height="90" fill="url(#gold)"/>
  <rect x="98" y="220" width="6" height="90" fill="#ffd27a" opacity=".55"/>

  <rect x="236" y="216" width="30" height="98" fill="#1f0710"/>
  <rect x="240" y="220" width="22" height="90" fill="url(#gold)"/>
  <rect x="240" y="220" width="6" height="90" fill="#ffd27a" opacity=".55"/>

  <!-- lock plate -->
  <rect x="152" y="190" width="56" height="68" fill="#1f0710"/>
  <rect x="157" y="195" width="46" height="58" fill="url(#gold)"/>
  <rect x="157" y="195" width="46" height="6" fill="#fef3c7" opacity=".7"/>
  <rect x="172" y="212" width="16" height="16" fill="#3a0a17"/>
  <rect x="176" y="226" width="8" height="14" fill="#3a0a17"/>

  <!-- feet -->
  <rect x="64" y="314" width="26" height="14" fill="#1f0710"/>
  <rect x="270" y="314" width="26" height="14" fill="#1f0710"/>

  <!-- rim highlight -->
  <rect x="46" y="126" width="268" height="4" fill="#ffd27a" opacity=".35"/>
  <rect x="46" y="216" width="268" height="3" fill="#ffd27a" opacity=".2"/>
</svg>
